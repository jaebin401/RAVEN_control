schema_version: 1

session:
  name: taught_demo
  pose_count: 0
  repeat_count: 1
  # Natural completion always returns to the pose captured immediately before
  # playback. The app rejects false so this safety behavior cannot be bypassed.
  return_to_start: true
  default_transition_s: 3.0
  default_hold_s: 0.7
  return_transition_s: 3.0
  controlled_stop_s: 1.0

# Copy this template into recordings/ before running. SPACE in Teach mode adds
# calibrated absolute joint positions here; no motor zero is rewritten.
poses: []
